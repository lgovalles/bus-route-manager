name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ============================================
  # Pre-deployment Checks
  # ============================================
  pre-deployment-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version format
        run: |
          VERSION=${{ github.event.inputs.version }}
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use semantic versioning (e.g., 1.0.0)"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

      - name: Verify main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Deployments must be from main branch"
            exit 1
          fi
          echo "✅ Deploying from main branch"

  # ============================================
  # Build & Push Release Images
  # ============================================
  build-release:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    permissions:
      contents: read
      packages: write

    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend Release Image
      - name: Extract metadata - Backend
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version }}
            type=raw,value=latest

      - name: Build and push backend release image
        uses: docker/build-push-action@v4
        with:
          context: ./fastapi_backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.event.inputs.version }}

      # Frontend Release Image
      - name: Extract metadata - Frontend
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version }}
            type=raw,value=latest

      - name: Build and push frontend release image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.event.inputs.version }}

  # ============================================
  # Deploy to Staging (if staging selected)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event.inputs.environment == 'staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend to Railway (Staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway link ${{ secrets.RAILWAY_STAGING_BACKEND_SERVICE_ID }}
          railway up --service ${{ secrets.RAILWAY_STAGING_BACKEND_SERVICE_ID }}

      - name: Deploy Frontend to Railway (Staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_STAGING_FRONTEND_SERVICE_ID }}
          railway up --service ${{ secrets.RAILWAY_STAGING_FRONTEND_SERVICE_ID }}

      - name: Run Staging Tests
        run: |
          echo "🧪 Running staging smoke tests..."
          # Aquí irían tus tests de staging

      - name: Create Release Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a v${{ github.event.inputs.version }} -m "Release v${{ github.event.inputs.version }}"
          git push origin v${{ github.event.inputs.version }}

  # ============================================
  # Deploy to Production (Canary Strategy)
  # ============================================
  deploy-production:
    name: Deploy to Production (Canary)
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ secrets.PROD_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Canary Deploy - 5% Traffic
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          echo "🟡 Deploying to 5% of production traffic..."
          # Simular canary deployment
          railway link ${{ secrets.RAILWAY_PROD_BACKEND_SERVICE_ID }}
          railway up --service ${{ secrets.RAILWAY_PROD_BACKEND_SERVICE_ID }}

      - name: Monitor Canary - 5 minutes
        run: |
          echo "📊 Monitoring canary deployment..."
          sleep 300
          # Aquí irían checks de métricas

      - name: Canary Deploy - 50% Traffic
        run: |
          echo "🟠 Increasing to 50% of production traffic..."
          sleep 300

      - name: Canary Deploy - 100% Traffic
        run: |
          echo "🟢 Rolling out to 100% of production traffic..."
          sleep 300

      - name: Deploy Frontend to Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_PROD_FRONTEND_SERVICE_ID }}
          railway up --service ${{ secrets.RAILWAY_PROD_FRONTEND_SERVICE_ID }}

      - name: Production Health Check
        run: |
          API_URL=${{ secrets.PROD_API_URL }}
          for i in {1..30}; do
            if curl -f -s "$API_URL/health" > /dev/null; then
              echo "✅ Production API is healthy"
              exit 0
            fi
            echo "⏳ Waiting for production API... ($i/30)"
            sleep 10
          done
          echo "❌ Production API failed"
          exit 1

      - name: Create Production Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a v${{ github.event.inputs.version }} -m "Production Release v${{ github.event.inputs.version }}"
          git push origin v${{ github.event.inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          body: |
            # Production Release v${{ github.event.inputs.version }}
            
            Deployed with canary strategy to production.
            
            **Changes:**
            - [View commits](https://github.com/${{ github.repository }}/compare/main...v${{ github.event.inputs.version }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Notification
  # ============================================
  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Determine Deployment Status
        id: status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Send Success Notification
        if: success()
        run: |
          echo "🎉 Deployment to ${{ github.event.inputs.environment }} completed successfully!"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "URL: ${{ secrets[format('{0}_API_URL', github.event.inputs.environment | upper)] }}"

      - name: Send Failure Notification
        if: failure()
        run: |
          echo "❌ Deployment to ${{ github.event.inputs.environment }} FAILED"
          exit 1
